[project]
name = "pet-agentic"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-dotenv>=1.0",
    "requests>=2.0",
    "pyyaml>=6.0",
    "deepagents>=0.4",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langchain-mcp-adapters>=0.1",
    "langchain-fireworks>=0.3",
    "ag-ui-protocol>=0.1.19",
    "wikipedia-mcp>=2.0",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "ddgs>=9.0",
    "google-search-results>=2.4",
]

[project.optional-dependencies]
lint = [
    "pyright>=1.1.411",
    "pylint>=4.0.5",
    "ruff>=0.15.12",
]
dev = [
    "pytest>=8.0",
]
test = [
    "pytest>=8.0",
]

[tool.pyright]
extraPaths = ["examples", "examples/search_service"]

[tool.ty.environment]
extra-paths = ["examples", "examples/search_service"]

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, 'examples'); sys.path.insert(0, 'examples/search_service')"
disable = [
    "broad-exception-caught",
    "duplicate-code",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-positional-arguments",
    "too-many-return-statements",
    "too-many-statements"
]

[dependency-groups]
dev = [
    "pylint>=4.0.6",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
