name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

jobs:
    frontend:
        name: Frontend — Lint & Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version-file: ".python-version"

            - name: Install uv
              uses: astral-sh/setup-uv@v4

            - name: Install dependencies
              run: npm run setup

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm run test

            - name: Build
              run: npm run build

    backend:
        name: Backend — Lint & Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version-file: ".python-version"

            - name: Install uv
              uses: astral-sh/setup-uv@v4

            - name: Install Python dependencies
              run: uv sync

            - name: Lint (ruff check)
              run: uv run ruff check .

            - name: Format check (ruff format --check)
              run: uv run ruff format --check .

            - name: Type check with pyright
              run: uv run pyright backend/ agent/ examples/

            - name: Lint (pylint)
              run: uv run pylint backend/ agent/ examples/
              continue-on-error: true

            - name: Run tests
              run: |
                  if uv run pytest backend/ agent/ -v; then
                    exit 0
                  fi

                  exit_code=$?
                  if [ "$exit_code" -eq 5 ]; then
                    echo "No tests collected; skipping test failure."
                    exit 0
                  fi

                  exit "$exit_code"
              env:
                  LLM_BASE_URL: http://localhost:6000/v1
                  VITE_API_HOST: 127.0.0.1
                  VITE_API_PORT: 80
                  LOG_LEVEL: info
